<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#3b2414">
<title>Truco Criollo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="img/icono-192.png">
<link rel="apple-touch-icon" href="img/icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Truco">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ===================== INICIO ===================== -->
  <section id="home" class="home">
    <div class="scene"></div>
    <button class="menu-btn sonido-home" id="sonidoHome" aria-label="Sonido"></button>
    <div class="home-inner">
      <div class="plaque">
        <div class="plaque-title">Truco Criollo</div>
        <div class="plaque-sub">mano a mano · a 30 · sin flor</div>
      </div>
      <div class="fan-deco" id="fanDeco"></div>
      <div class="parchment">
        <div class="saludo hidden" id="saludo"></div>
        <label for="name" id="nameLbl">Tu nombre</label>
        <input id="name" maxlength="14" placeholder="Ej: Mati" autocomplete="off">
        <div class="mis-partidas" id="misPartidas"></div>
        <button class="wbtn gold" id="playBot">Jugar contra la máquina</button>
        <button class="wbtn" id="amigosBtn">Amigos<span class="badge" id="badgeAmigos"></span></button>
        <button class="wbtn" id="tourney">Torneos<span class="badge" id="badgeTorneos"></span></button>
        <button class="wbtn" id="playFriend">Jugar con un amigo</button>
        <div class="cuenta-btns hidden" id="cuentaBtns">
          <div class="sub-home">Para jugar con amigos y torneos:</div>
          <button class="wbtn" id="crearUsuario">Crear mi usuario</button>
          <button class="linkbtn" id="yaTengo">Ya tengo usuario</button>
        </div>
        <button class="instalar hidden" id="instalarBtn"></button>
      </div>
      <button class="credits-link" id="openCredits">Créditos y licencias</button>
    </div>
  </section>

  <!-- ===================== MESA ===================== -->
  <section id="game" class="game hidden">
    <div class="scene"></div>

    <!-- tanteador -->
    <header class="topbar wood">
      <div class="tant">
        <span class="tname" id="labelMe">Vos</span>
        <div class="tbox" id="fosMe"></div>
      </div>
      <div class="tant">
        <span class="tname" id="labelBot">Rival</span>
        <div class="tbox" id="fosBot"></div>
      </div>
      <div class="tmeta"><b>a 30</b><span id="scoreNum">0 · 0</span></div>
      <button class="menu-btn" id="sonidoMesa" aria-label="Sonido"></button>
      <button class="menu-btn" id="menuBtn" aria-label="Menú">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="#f1e2c0" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </header>

    <!-- mesa en perspectiva -->
    <div class="tablewrap">
      <div class="table" id="table">
        <div class="guarda left"></div><div class="guarda right"></div>
        <img class="mate" id="mate" alt="">
        <div class="rivalhand" id="botHand"></div>
        <div class="deck" id="deck"></div>
        <div class="played" id="played"></div>
      </div>
    </div>

    <!-- rival -->
    <div class="player rival">
      <div class="nameplate" id="rivalName">Rival</div>
      <div class="avatar" id="rivalAvatar"></div>
      <div class="bubble" id="bubbleBot"></div>
      <svg class="ring" id="ringBot" viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="45"/><circle class="prog" cx="50" cy="50" r="45" pathLength="100"/></svg>
      <div class="secs hidden" id="secsBot"></div>
    </div>

    <!-- vos -->
    <div class="player me">
      <div class="avatar" id="meAvatar"></div>
      <div class="bubble" id="bubbleMe"></div>
      <div class="envchip" id="envMe">Envido 0</div>
      <svg class="ring" id="ringMe" viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="45"/><circle class="prog" cx="50" cy="50" r="45" pathLength="100"/></svg>
      <div class="secs hidden" id="secsMe"></div>
    </div>

    <div class="status" id="status"></div>
    <div class="banner hidden" id="banner"></div>
    <div class="myhand" id="myHand"></div>

    <!-- botonera -->
    <nav class="bottombar wood" id="actions"></nav>
    <div class="envmenu hidden" id="envMenu"></div>

    <div class="overlay hidden" id="overlay"></div>
  </section>

  <div class="overlay hidden" id="dialog"></div>
  <div class="overlay hidden" id="aviso"></div>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
